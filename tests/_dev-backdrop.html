<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>backdrop photos — hero copy on top, ::before paint, icon badge</title>
<style>
  /* the body-level hero carries its photo inline — see the markup below */
  .hero-css {
    height: 300px;
    background-image: url('https://images.unsplash.com/photo-1111111111111-aaaaaaaaaaaa?w=1500');
    background-size: cover;
  }
  .band-pseudo { height: 260px; position: relative; }
  .band-pseudo::before {
    content: "";
    position: absolute; inset: 0;
    background-image: url('https://images.unsplash.com/photo-2222222222222-cccccccccccc?w=1400');
    background-size: cover;
  }
  /* pseudo overlay that forgot to say "cover" — still a photo on a big box */
  .band-pseudo-plain { height: 240px; position: relative; }
  .band-pseudo-plain::before {
    content: "";
    position: absolute; inset: 0;
    background-image: url('https://images.unsplash.com/photo-3333333333333-dddddddddddd?w=1300');
  }
  .icon-figure {
    height: 220px;
    background-image: url('https://images.unsplash.com/photo-4444444444444-eeeeeeeeeeee?w=900');
    background-size: cover;
  }
  /* ---------- things that must NOT become a photo ---------- */
  .patterned { height: 160px; background-image: url('https://example.com/pattern-16.png'); }
  .Gradient-band { height: 160px; background: linear-gradient(135deg, #123456, #abcdef); }
  .plain-panel  { height: 160px; background: #1f2937; }
  .data-blob    { height: 120px; background-image: url("data:image/svg+xml,%3Csvg/%3E"); }
  .tiny-logo    { width: 40px; height: 40px; background-image: url('https://cdn.example.com/logo.png'); background-size: contain; }
</style>
</head>
<body>

<!-- a hero that IS the body-level band itself: root photo written inline,
     nothing above it, exactly how it comes out of Squarespace / Aura -->
<div class="hero-inline" style="background: url('https://images.unsplash.com/photo-2000000000000-bbbbbbbbbbbb?w=1600') center/cover no-repeat">
  <h2>Walk With Me</h2>
  <p>A sleepy afternoon loop around the reservoir, Otis in the lead.</p>
  <a href="/book">Book a walk</a>
</div>

<!-- class-driven hero, one level down inside a section -->
<section>
  <div class="hero-css">
    <h3>Sunset Route</h3>
    <a href="/sunset">See the route</a>
  </div>
</section>

<!-- the photo is painted by ::before -->
<section>
  <div class="band-pseudo"><span>Painted from ::before</span></div>
</section>

<section>
  <div class="band-pseudo-plain"><span>::before without cover, still a photo</span></div>
</section>

<!-- a photo tile that also carries an icon -->
<section>
  <figure class="icon-figure">
    <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffffff"/></svg>
  </figure>
</section>

<!-- decoys -->
<section>
  <div class="patterned"><p>Repeating texture, not a photo</p></div>
</section>

<section>
  <div class="Gradient-band"><p class="pasted-text">Gradient panel, not a photo</p></div>
</section>

<section>
  <div class="plain-panel"><p>Solid colour panel</p></div>
</section>

<section>
  <div class="data-blob"><p>Inline data URI placeholder</p></div>
</section>

<section>
  <div class="tiny-logo"><span class="sr-only">Brand</span></div>
</section>

</body>
</html>
